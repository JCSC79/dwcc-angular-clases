<button type="button" (click)="baleirarTaboa()">
    Baleirar táboa
</button>

<table *ngIf="series.length > 0; else nonHaiSeries">
    <thead>
        <tr>
            <th>Título</th>
            <th>Primeira emisión</th>
            <th>Xénero</th>
            <th>Idioma</th>
            <th>En emisión</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let serie of series; let impar=odd; let par=even;" [ngClass]="{ 'impar' : impar, 'par': par, 'foraEmision': !serie.enEmision }">
            <td>{{ serie.titulo }}</td>
            <td>{{ serie.primeiraEmision | date: 'dd/MM/yyyy' }}</td>
            <td>{{ serie.xenero }}</td>
            <td>{{ serie.idioma }}</td>
            <td>{{ serie.enEmision }}</td>
        </tr>
    </tbody>
</table>

<ng-template #nonHaiSeries>
    <p>NON HAI SERIES QUE AMOSAR</p>
</ng-template>

<!-- Mensaje de bienvenida clásico de "Hola Mundo" -->

<p><strong>Concepto fundamental:</strong> La sintaxis <code>{{ sintaxisInterpolacion }}</code> permite insertar valores dinámicos de la clase del componente directamente en el HTML.</p>

<div class="modal-fondo">
    <div class="modal">
        <h3>Crear novo utensilio de cociña</h3>

        <form class="formulario">
            <label for="nome">
                Nome
                <input type="text" name="nome" [(ngModel)]="nome">
            </label>
            <label for="material">
                Material
                <input type="text" name="material" [(ngModel)]="material">
            </label>
            <div class="botons">
                <button type="button" class="btnCrear" (click)="crear()">
                    CREAR
                </button>
                <button type="button" class="btnCancelar" (click)="cancelar()">
                    CANCELAR
                </button>
            </div>
        </form>
    </div>
</div>

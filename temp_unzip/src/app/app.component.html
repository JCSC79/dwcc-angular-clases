<button (click)="amosarCrearUtensilio=true">
    Crear novo utensilio de cociña
</button>

<table>
    <tr>
        <th>Nome</th>
        <th>Material</th>
    </tr>
    <tr *ngFor="let utensilio of utensilios">
        <td>
            {{ utensilio.nome }}
        </td>
        <td>
            {{ utensilio.material }}
        </td>
    </tr>
</table>

<app-crear-utensilio *ngIf="amosarCrearUtensilio" (pechar)="amosarCrearUtensilio=false"></app-crear-utensilio>

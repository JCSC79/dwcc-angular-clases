<table>
    <thead>
        <tr>
            <th>Nome</th>
            <th>País</th>
            <th>Data de estrea</th>
            <th>Carga útil (kg)</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let cohetes of cohetes">
            <td>{{cohetes.nome}}</td>
            <td>{{cohetes.pais}}</td>
            <td>{{cohetes.dataEstrea}}</td>
            <td>{{cohetes.cargaUtil}}</td>
        </tr>
    </tbody>
</table>

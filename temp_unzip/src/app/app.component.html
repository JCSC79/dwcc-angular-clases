<table>
    <thead>
        <th>Título</th>
        <th>Ano</th>
        <th>Xénero</th>
        <th>Director/a</th>
    </thead>
    <tbody>
        <tr *ngFor="let pelicula of peliculas">
            <td>{{ pelicula.titulo }}</td>
            <td>{{ pelicula.ano }}</td>
            <td>{{ pelicula.xenero }}</td>
            <td>{{ pelicula.diretor }}</td>
        </tr>
    </tbody>
</table>

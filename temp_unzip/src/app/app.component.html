<button type="button" (click)="amosarCrearCalefactores=true">
    Crear novo calefactor
</button>

<table>
    <tr>
        <th>Modelo</th>
        <th>Potencia (Kw)</th>
    </tr>
    <tr *ngFor="let calefactor of calefactores">
        <td>
            {{ calefactor.modelo }}
        </td>
        <td>
            {{ calefactor.potencia }}
        </td>
    </tr>
</table>

<app-crear-calefactor *ngIf="amosarCrearCalefactores"></app-crear-calefactor>
